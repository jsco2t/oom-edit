# Vendored-sources replacement — activated in T02.
#
# When dependencies are vendored into vendor/, activate the following
# blocks (uncomment) and remove the [source.crates-io] override below.
#
# Until then, builds use crates.io directly.

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"
