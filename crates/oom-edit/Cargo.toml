[package]
name = "oom-edit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Console/TUI markdown editor with Vim-style modal editing and View mode"

[[bin]]
name = "oom-edit"
path = "src/main.rs"

[dependencies]
ratatui = "=0.30.2"
crossterm = "=0.28.1"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[dev-dependencies]

[lints]
workspace = true
