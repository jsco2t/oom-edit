[package]
name = "oom-edit"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Console/TUI markdown editor with rendered Normal and Select modes"

[[bin]]
name = "oom-edit"
path = "src/main.rs"

[dependencies]
oom-spell = { path = "../oom-spell", version = "=0.1.0" }
oom-edit-core = { path = "../oom-edit-core", version = "=0.4.0" }
ratatui = "=0.30.2"
crossterm = { version = "=0.29.0", features = ["bracketed-paste"] }
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.4"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[dev-dependencies]
tempfile = "=3.26.0"

[lints]
workspace = true
